<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!--
    ============================================================
    File: login.html
    Purpose:
      - Login-UI für QuizDuell.
      - Nutzer wählt zuerst einen vorhandenen Spieler aus der Liste.
      - Danach wird das Passwort eingegeben und an /api/auth/login gesendet.
      - Bei Erfolg: currentPlayer wird in localStorage gespeichert, Redirect zur Lobby.

    Dependencies:
      - Bootstrap 5 (Layout/Styles)
      - REST API:
          GET  /api/players      -> Liste aller Spieler (für Auswahl)
          POST /api/auth/login   -> Login anhand playerId + password

    Storage:
      - localStorage.currentPlayer: JSON(PlayerResponse)
        Wird nach erfolgreichem Login gespeichert und in anderen Seiten genutzt.

    UX Flow:
      1) Seite lädt -> loadAllPlayers()
      2) Spielerkarte klicken -> selectPlayer(player) -> Formular anzeigen
      3) Formular submit -> POST /api/auth/login
      4) Success -> Redirect /lobby.html
    ============================================================
  -->

  <title>Anmelden - QuizDuell</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>

  <style>
    /* =========================
       LAYOUT
    ========================= */
    .container-center{display:flex;justify-content:center;align-items:center;min-height:100vh}

    /* =========================
       PLAYER PREVIEW (selected)
    ========================= */
    .profile-preview{
      width:80px;height:80px;border-radius:50%;object-fit:cover;margin:0 auto 15px;display:block;
      border:3px solid #007bff
    }

    /* =========================
       PLAYER CARD (hover only)
       - Hover wird rein über CSS gemacht (keine JS-Animation nötig)
    ========================= */
    .player-card{cursor:pointer;transition:background-color .2s}
    .player-card:hover{background:#f8f9fa}
  </style>
</head>

<body class="bg-light">

<!--
  ============================================================
  SECTION: Login Card
  - Error/Success Messages
  - Players List (Auswahl)
  - Login Form (hidden bis Spieler gewählt)
  ============================================================
-->
<div class="container-center">
  <div class="card p-4 shadow" style="max-width: 400px; width: 100%;">
    <h3 class="mb-3 text-center">Anmelden</h3>

    <!-- Error / Success Feedback -->
    <div id="errorMessage" class="alert alert-danger d-none"></div>
    <div id="successMessage" class="alert alert-success d-none"></div>

    <!-- Player selection list -->
    <div id="playersList" class="mb-4 p-3 bg-light rounded">
      <h6 class="text-center mb-3">Wähle einen Spieler:</h6>
      <div id="playersContainer" class="text-center">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Lade Spieler...</span>
        </div>
      </div>
    </div>

    <!-- Login form (sichtbar erst nach Auswahl) -->
    <form id="loginForm" class="d-none">
      <div class="mb-3">
        <label class="form-label">Ausgewählter Spieler</label>
        <div class="text-center">
          <img id="selectedPlayerImage" src="" class="profile-preview d-none" alt="Profilbild">
          <h5 id="selectedPlayerName" class="mb-3"></h5>
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Passwort</label>
        <input type="password" class="form-control" id="password" placeholder="Passwort" required>
      </div>

      <button type="submit" class="btn btn-success w-100">Anmelden</button>
    </form>

    <div class="text-center mt-3">
      <a href="/signup.html" class="text-decoration-none">Noch keinen Account? Registrieren</a><br>
      <a href="/index.html" class="text-decoration-none mt-2 d-block">← Zurück zur Startseite</a>
    </div>
  </div>
</div>

<script>
  /* =====================================================================
     JSDOC TYPE DEFINITIONS
     ===================================================================== */

  /**
   * @typedef {Object} PlayerResponse
   * @property {number} id
   * @property {string} username
   * @property {string} [profileImageUrl]
   * @property {number} totalGames
   * @property {number} gamesWon
   * @property {number} gamesLost
   * @property {number} highscore
   */

  /* =========================
     GLOBAL STATE
  ========================= */

  /** @type {PlayerResponse|null} Aktuell ausgewählter Spieler */
  let selectedPlayer = null;

  /** @type {string} Default Avatar-Fallback */
  const DEFAULT_AVATAR = '/images/default-avatar.png';

  /* =========================
     DOM HELPERS
  ========================= */

  /**
   * Kurzform für document.getElementById
   * @param {string} id
   * @returns {HTMLElement|null}
   */
  const $ = (id) => document.getElementById(id);

  /**
   * Zeigt/Versteckt ein Element über die Klasse "d-none".
   * @param {HTMLElement} el
   * @param {boolean} show
   * @returns {void}
   */
  const toggle = (el, show) => el.classList.toggle('d-none', !show);

  /**
   * Bündelt häufig verwendete DOM-Referenzen, damit wir nicht ständig neu suchen.
   */
  const els = {
    playersContainer: $('playersContainer'),
    playersList: $('playersList'),
    loginForm: $('loginForm'),
    selectedPlayerName: $('selectedPlayerName'),
    selectedPlayerImage: $('selectedPlayerImage'),
    password: $('password'),
    error: $('errorMessage'),
    success: $('successMessage')
  };

  /* =========================
     INIT
  ========================= */

  /** Start: Spieler aus Backend laden */
  window.onload = loadAllPlayers;

  /* =========================
     DATA LOADING
  ========================= */

  /**
   * Lädt alle Spieler vom Backend und zeigt sie in der Auswahl an.
   *
   * REST:
   * - GET /api/players
   *
   * @returns {Promise<void>}
   */
  async function loadAllPlayers() {
    try {
      const res = await fetch('/api/players');
      const players = await res.json();
      displayPlayers(players);
    } catch (e) {
      console.error('Fehler beim Laden der Spieler:', e);
      els.playersContainer.innerHTML = '<p class="text-danger">Fehler beim Laden der Spieler</p>';
    }
  }

  /**
   * Rendert die Spieler-Liste oder einen Fallback, wenn keine Spieler existieren.
   * @param {PlayerResponse[]} [players=[]]
   * @returns {void}
   */
  function displayPlayers(players = []) {
    if (!players.length) {
      els.playersContainer.innerHTML = `
        <p class="text-muted">Keine Spieler gefunden</p>
        <a href="/signup.html" class="btn btn-primary btn-sm">Ersten Spieler erstellen</a>
      `;
      return;
    }

    els.playersContainer.innerHTML = '';
    players.forEach(player => els.playersContainer.appendChild(renderPlayerCard(player)));
  }

  /* =========================
     RENDERING
  ========================= */

  /**
   * Erstellt eine klickbare Player-Karte für die Auswahl.
   * - Zeigt Avatar (mit Fallback)
   * - Zeigt username + Stats
   * - Click -> selectPlayer(player)
   *
   * @param {PlayerResponse} player
   * @returns {HTMLDivElement}
   */
  function renderPlayerCard(player) {
    const div = document.createElement('div');
    div.className = 'player-card mb-3 p-3 border rounded bg-white';

    const img = (player.profileImageUrl && player.profileImageUrl.trim())
      ? player.profileImageUrl.trim()
      : DEFAULT_AVATAR;

    div.innerHTML = `
      <div class="d-flex align-items-center">
        <img
          src="${img}"
          class="rounded-circle me-3"
          style="width:50px;height:50px;object-fit:cover;"
          onerror="this.onerror=null; this.src='${DEFAULT_AVATAR}';"
          alt="Profilbild">
        <div class="flex-grow-1">
          <h6 class="mb-0">${player.username}</h6>
          <small class="text-muted">
            Spiele: ${player.totalGames} | Siege: ${player.gamesWon} | Highscore: ${player.highscore}
          </small>
        </div>
        <div class="text-success"><small>Zum Anmelden klicken</small></div>
      </div>
    `;

    div.addEventListener('click', () => selectPlayer(player));
    return div;
  }

  /* =========================
     SELECTION / UI STATE
  ========================= */

  /**
   * Setzt den ausgewählten Spieler und zeigt das Login-Formular an.
   * - Spielername + Avatar Preview werden aktualisiert
   * - Player-Liste wird ausgeblendet
   * - Passwortfeld wird geleert und fokussiert
   *
   * @param {PlayerResponse} player
   * @returns {void}
   */
  function selectPlayer(player) {
    selectedPlayer = player;

    els.selectedPlayerName.textContent = player.username;

    // Avatar setzen (mit Fallback + onerror)
    const img = (player.profileImageUrl && player.profileImageUrl.trim())
      ? player.profileImageUrl.trim()
      : DEFAULT_AVATAR;

    els.selectedPlayerImage.src = img;

    els.selectedPlayerImage.onerror = () => {
      els.selectedPlayerImage.onerror = null;
      els.selectedPlayerImage.src = DEFAULT_AVATAR;
    };

    toggle(els.selectedPlayerImage, true);

    toggle(els.loginForm, true);
    toggle(els.playersList, false);

    els.password.value = '';
    els.password.focus();
  }

  /**
   * Optionaler UI-Helper um zur Player-Liste zurückzugehen.
   * (Im aktuellen UI nicht an einen Button gebunden.)
   *
   * @returns {void}
   */
  function goBackToPlayers() {
    toggle(els.loginForm, false);
    toggle(els.playersList, true);
    selectedPlayer = null;
  }

  /* =========================
     LOGIN FLOW
  ========================= */

  /**
   * Submit Handler:
   * - Validiert Auswahl + Passwort
   * - POST /api/auth/login
   * - Bei Erfolg: localStorage.currentPlayer setzen und redirect
   */
  $('loginForm').addEventListener('submit', async (event) => {
    event.preventDefault();

    const password = els.password.value;
    hideMessages();

    if (!selectedPlayer) return showError('Bitte einen Spieler auswählen');
    if (!password) return showError('Bitte Passwort eingeben');

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ playerId: selectedPlayer.id, password })
      });

      if (!res.ok) {
        if (res.status === 401) return showError('❌ Falsches Passwort');
        return showError(`❌ Login fehlgeschlagen (HTTP ${res.status})`);
      }

      /** @type {PlayerResponse} */
      const player = await res.json();
      localStorage.setItem('currentPlayer', JSON.stringify(player));

      showSuccess('✅ Erfolgreich angemeldet!');
      setTimeout(() => location.href = '/lobby.html', 700);

    } catch (e) {
      console.error(e);
      showError('❌ Server nicht erreichbar');
    }
  });

  /* =========================
     MESSAGES
  ========================= */

  /**
   * Versteckt Error- und Success-Message.
   * @returns {void}
   */
  function hideMessages() {
    toggle(els.error, false);
    toggle(els.success, false);
  }

  /**
   * Zeigt eine Error-Message an.
   * @param {string} message
   * @returns {void}
   */
  function showError(message) {
    els.error.textContent = message;
    toggle(els.error, true);
  }

  /**
   * Zeigt eine Success-Message an.
   * @param {string} message
   * @returns {void}
   */
  function showSuccess(message) {
    els.success.textContent = message;
    toggle(els.success, true);
  }
</script>
</body>
</html>

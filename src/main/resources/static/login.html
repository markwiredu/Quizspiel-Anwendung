<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anmelden - QuizDuell</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <style>
    .container-center {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }
    .profile-preview {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        object-fit: cover;
        margin: 0 auto 15px;
        display: block;
        border: 3px solid #007bff;
    }
  </style>
</head>
<body class="bg-light">
<div class="container-center">
  <div class="card p-4 shadow" style="max-width: 400px; width: 100%;">
    <h3 class="mb-3 text-center">Anmelden</h3>

    <div id="errorMessage" class="alert alert-danger d-none"></div>
    <div id="successMessage" class="alert alert-success d-none"></div>

    <!-- Verfügbare Spieler anzeigen -->
    <div id="playersList" class="mb-4 p-3 bg-light rounded">
      <h6 class="text-center mb-3">Wähle einen Spieler:</h6>
      <div id="playersContainer" class="text-center">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Lade Spieler...</span>
        </div>
      </div>
    </div>

    <!-- Direkt-Login Formular -->
    <form id="loginForm" class="d-none">
      <div class="mb-3">
        <label class="form-label">Ausgewählter Spieler</label>
        <div class="text-center">
          <img id="selectedPlayerImage" src="" class="profile-preview d-none" alt="Profilbild">
          <h5 id="selectedPlayerName" class="mb-3"></h5>
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Passwort</label>
        <input type="password" class="form-control" id="password" placeholder="Passwort" required>
      </div>

      <button type="submit" class="btn btn-success w-100">Anmelden</button>
    </form>

    <div class="text-center mt-3">
      <a href="/signup.html" class="text-decoration-none"> Noch keinen Account? Registrieren</a><br>
      <a href="/index.html" class="text-decoration-none mt-2 d-block">← Zurück zur Startseite</a>
    </div>
  </div>
</div>

<script>
  let selectedPlayer = null;

  // Beim Laden Spieler laden
  window.onload = function() {
      loadAllPlayers();
  };

  // Alle Spieler laden
  function loadAllPlayers() {
      fetch('/api/players')
          .then(response => response.json())
          .then(players => {
              displayPlayers(players);
          })
          .catch(error => {
              console.error('Fehler beim Laden der Spieler:', error);
              document.getElementById('playersContainer').innerHTML =
                  '<p class="text-danger">Fehler beim Laden der Spieler</p>';
          });
  }

  // Spieler anzeigen
  function displayPlayers(players) {
      const container = document.getElementById('playersContainer');

      if (players.length === 0) {
          container.innerHTML = `
              <p class="text-muted">Keine Spieler gefunden</p>
              <a href="/signup.html" class="btn btn-primary btn-sm">Ersten Spieler erstellen</a>
          `;
          return;
      }

      container.innerHTML = '';

      players.forEach(player => {
          const playerCard = document.createElement('div');
          playerCard.className = 'mb-3 p-3 border rounded bg-white';
          playerCard.style.cursor = 'pointer';
          playerCard.style.transition = 'background-color 0.2s';

          playerCard.innerHTML = `
              <div class="d-flex align-items-center">
                  <img src="${player.profileImageUrl || '/images/default-avatar.jpg'}"
                       class="rounded-circle me-3"
                       style="width: 50px; height: 50px; object-fit: cover;">
                  <div class="flex-grow-1">
                      <h6 class="mb-0">${player.username}</h6>
                      <small class="text-muted">
                          Spiele: ${player.totalGames} |
                          Siege: ${player.gamesWon} |
                          Highscore: ${player.highscore}
                      </small>
                  </div>
                  <div class="text-success">
                      <small>Zum Anmelden klicken</small>
                  </div>
              </div>
          `;

          playerCard.addEventListener('click', () => {
              selectPlayer(player);
          });

          playerCard.addEventListener('mouseenter', () => {
              playerCard.style.backgroundColor = '#f8f9fa';
          });

          playerCard.addEventListener('mouseleave', () => {
              playerCard.style.backgroundColor = 'white';
          });

          container.appendChild(playerCard);
      });
  }

  // Spieler auswählen
  function selectPlayer(player) {
      selectedPlayer = player;

      // UI aktualisieren
      document.getElementById('selectedPlayerName').textContent = player.username;

      const playerImage = document.getElementById('selectedPlayerImage');
      playerImage.src = player.profileImageUrl || '/images/default-avatar.jpg';
      playerImage.classList.remove('d-none');

      // Formular anzeigen
      document.getElementById('loginForm').classList.remove('d-none');
      document.getElementById('playersList').classList.add('d-none');

      // Passwort-Fokus
      document.getElementById('password').focus();
  }

  // Zurück zur Spieler-Auswahl
  function goBackToPlayers() {
      document.getElementById('loginForm').classList.add('d-none');
      document.getElementById('playersList').classList.remove('d-none');
      selectedPlayer = null;
  }

  // Login verarbeiten
  document.getElementById('loginForm').addEventListener('submit', async function(event) {
  event.preventDefault();

  const password = document.getElementById('password').value;
  const errorDiv = document.getElementById('errorMessage');
  const successDiv = document.getElementById('successMessage');

  errorDiv.classList.add('d-none');
  successDiv.classList.add('d-none');

  if (!selectedPlayer) return showError('Bitte einen Spieler auswählen');
  if (!password) return showError('Bitte Passwort eingeben');

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        playerId: selectedPlayer.id,
        password: password
      })
    });

    if (!res.ok) {
      if (res.status === 401) return showError('❌ Falsches Passwort');
      return showError(`❌ Login fehlgeschlagen (HTTP ${res.status})`);
    }

    const player = await res.json();

    // ✅ aktuellen Spieler speichern (vom Backend, nicht aus Liste)
    localStorage.setItem('currentPlayer', JSON.stringify(player));

    showSuccess('✅ Erfolgreich angemeldet!');
    setTimeout(() => window.location.href = '/lobby.html', 700);

  } catch (e) {
    console.error(e);
    showError('❌ Server nicht erreichbar');
  }
});



  // Hilfsfunktionen
  function showError(message) {
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.textContent = message;
      errorDiv.classList.remove('d-none');
  }

  function showSuccess(message) {
      const successDiv = document.getElementById('successMessage');
      successDiv.textContent = message;
      successDiv.classList.remove('d-none');
  }
</script>
</body>
</html>

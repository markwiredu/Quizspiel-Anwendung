<!DOCTYPE html>
<html>
<head>
  <title>WebSocket Test</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>
<h1>WebSocket Test</h1>

<div>
  <button onclick="connect()">Connect WebSocket</button>
  <button onclick="disconnect()">Disconnect</button>
  <span id="status" style="color: red;">Disconnected</span>
</div>

<div>
  <h3>Messages:</h3>
  <div id="messages" style="border: 1px solid #ccc; height: 200px; overflow-y: scroll;"></div>
</div>

<script>
  let stompClient = null;

  function addMessage(message) {
      const messages = document.getElementById('messages');
      messages.innerHTML += '<div>' + new Date().toLocaleTimeString() + ': ' + message + '</div>';
      messages.scrollTop = messages.scrollHeight;
  }

  function connect() {
      const socket = new SockJS('/quiz-websocket');
      stompClient = Stomp.over(socket);

      stompClient.connect({}, function(frame) {
          document.getElementById('status').innerHTML = 'Connected ✅';
          document.getElementById('status').style.color = 'green';
          addMessage('✅ WebSocket connected!');

          // Subscribe to test topic
          stompClient.subscribe('/topic/test', function(message) {
              addMessage('📢 Received: ' + message.body);
          });

      }, function(error) {
          addMessage('❌ Error: ' + error);
      });
  }

  function disconnect() {
      if (stompClient) {
          stompClient.disconnect();
      }
      document.getElementById('status').innerHTML = 'Disconnected ❌';
      document.getElementById('status').style.color = 'red';
      addMessage('❌ Disconnected');
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erfolgreich registriert - QuizDuell</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body>
<div class="container text-center" style="max-width: 400px; margin-top: 100px;">
  <h3 class="mb-4">✅ Erfolgreich registriert!</h3>

  <div id="playerInfo" class="mb-3 p-3 bg-light rounded"></div>

  <p class="mb-3">Dein Spieler-Konto wurde angelegt.</p>

  <a href="/login.html" class="btn btn-primary btn-lg d-block w-100 mb-3">Anmelden</a>
  <a href="/index.html" class="btn btn-secondary btn-lg d-block w-100">Zur Startseite</a>
</div>

<script>
  // Spieler-Info aus URL-Parameter anzeigen
  const urlParams = new URLSearchParams(window.location.search);
  const username = urlParams.get('username');

  if (username) {
      document.getElementById('playerInfo').innerHTML = `
          <strong>Benutzername:</strong> ${username}<br>
          <small class="text-muted">Du kannst dich jetzt anmelden</small>
      `;
  }
</script>
</body>
</html>

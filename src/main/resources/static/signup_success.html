<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!--
    ============================================================
    File: signup_success.html
    Purpose:
      - Bestätigungsseite nach erfolgreicher Registrierung.
      - Zeigt den registrierten Benutzernamen an (falls in der URL vorhanden).
      - Bietet Navigation zu Login oder Startseite.

    Incoming Data:
      - Query Parameter: ?username=<name>
        Wird von signup.html gesetzt:
          /signup_success.html?username=...

    Behavior:
      - Wenn username existiert: Info-Box anzeigen und Text setzen.
      - Wenn username fehlt: Seite bleibt allgemein (nur Erfolgsmeldung + Links).
    ============================================================
  -->

  <title>Erfolgreich registriert - QuizDuell</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>

<body>
<!--
  ============================================================
  SECTION: Confirmation Card
  ============================================================
-->
<div class="container text-center" style="max-width: 400px; margin-top: 100px;">
  <h3 class="mb-4">✅ Erfolgreich registriert!</h3>

  <!--
    Wird nur angezeigt, wenn ein username in der URL vorhanden ist.
    Default: d-none (hidden)
  -->
  <div id="playerInfo" class="mb-3 p-3 bg-light rounded d-none">
    <strong>Benutzername:</strong> <span id="usernameText"></span><br>
    <small class="text-muted">Du kannst dich jetzt anmelden</small>
  </div>

  <p class="mb-3">Dein Spieler-Konto wurde angelegt.</p>

  <a href="/login.html" class="btn btn-primary btn-lg d-block w-100 mb-3">Anmelden</a>
  <a href="/index.html" class="btn btn-secondary btn-lg d-block w-100">Zur Startseite</a>
</div>

<script>
  /* =====================================================================
     JSDOC: URL / Query Param Handling
     ===================================================================== */

  /**
   * Liest den Query-Parameter "username" aus der URL.
   * Beispiel:
   *   /signup_success.html?username=Max
   *
   * @type {string|null}
   */
  const username = new URLSearchParams(location.search).get('username');

  /**
   * Wenn ein Benutzername vorhanden ist:
   * - Text in der UI setzen
   * - Info-Box sichtbar machen (d-none entfernen)
   */
  if (username) {
    document.getElementById('usernameText').textContent = username;
    document.getElementById('playerInfo').classList.remove('d-none');
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <!--
    ============================================================
    File: game.html
    Purpose:
      - UI für das Quiz-Duell (2 Spieler, 5 Runden)
      - Anzeige: Spieler, Punkte, Frage, Antworten, Timer, Ergebnis
      - Kommunikation: WebSocket (SockJS + STOMP) mit Spring Backend
    Dependencies:
      - Bootstrap 5.3.3 (Layout/Buttons/Grid)
      - SockJS 1.6.1 + STOMP 2.3.3 (WebSocket Messaging)
    Runtime Storage:
      - localStorage.currentPlayer (JSON)
      - localStorage.currentGame   (JSON)
      - optional: autoJoinCategory (für "Play again")
    WebSocket Topics:
      - /topic/game/{gameId}              (GAME_START, ROUND_START, GAME_END, ...)
      - /topic/game/{gameId}/timer        (TIMER_START, TIMER_UPDATE)
      - /topic/game/{gameId}/countdown    (COUNTDOWN)
      - /topic/game/{gameId}/result       (ROUND_RESULT payload)
    REST Endpoints:
      - GET /api/games/{gameId}
      - GET /api/games/{gameId}/rounds
    ============================================================
  -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizDuell - Spiel</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

  <style>
    /* =========================
       THEME / COLORS
    ========================= */
    :root{
      --player1-color:#4e73df;
      --player2-color:#e74a3b;
      --neutral-color:#6c757d;
    }

    /* =========================
       LAYOUT BASICS
    ========================= */
    .game-container{max-width:1200px;margin:0 auto}

    .player-panel{
      min-height:260px;display:flex;flex-direction:column;
      justify-content:center;align-items:center;
    }
    .player1-panel{background:linear-gradient(135deg,var(--player1-color) 0%,#2e59d9 100%);color:#fff}
    .player2-panel{background:linear-gradient(135deg,var(--player2-color) 0%,#c0352b 100%);color:#fff}
    .col-4>.player-panel{width:100%}
    .player-panel h5{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

    .question-card{
      background:#fff;border:3px solid #dee2e6;border-radius:15px;
      padding:30px;margin:20px 0;box-shadow:0 5px 20px rgba(0,0,0,.1)
    }

    /* =========================
       ANSWERS GRID
    ========================= */
    .answers-grid{
      display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));
      gap:12px;max-width:600px;margin:0 auto;
    }
    .answers-grid .answer-btn{
      height:90px;font-size:1.1rem;font-weight:600;border-radius:14px;
      border:2px solid #dee2e6 !important;text-align:center !important;
      display:flex;align-items:center;justify-content:center;
    }

    /* =========================
       TIMER VISUALS
    ========================= */
    .timer-bar{height:10px;background:#e9ecef;border-radius:5px;overflow:hidden;margin:20px 0}
    .timer-progress{height:100%;background:linear-gradient(90deg,#1cc88a,#4e73df);transition:width 1s linear}

    .score-display{font-size:2.5rem;font-weight:700;text-shadow:2px 2px 4px rgba(0,0,0,.2)}

    /* =========================
       COUNTDOWN OVERLAY
    ========================= */
    .countdown-overlay{
      position:fixed;inset:0;background:rgba(0,0,0,.9);
      display:flex;align-items:center;justify-content:center;z-index:1000
    }
    .countdown-number{font-size:15rem;color:#fff;font-weight:700;animation:countdownPop .5s ease-out}
    @keyframes countdownPop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}

    /* =========================
       RESULT MODAL / OVERLAY
    ========================= */
    .game-result-modal{
      position:fixed;inset:0;background:rgba(0,0,0,.8);
      display:flex;align-items:center;justify-content:center;z-index:2000
    }
    .result-card{
      background:#fff;border-radius:20px;padding:40px;max-width:500px;
      text-align:center;animation:slideUp .5s ease-out
    }
    @keyframes slideUp{from{transform:translateY(50px);opacity:0}to{transform:translateY(0);opacity:1}}

    /* =========================
       ANSWER STATES (VISUAL FEEDBACK)
    ========================= */
    .answer-btn.correct{
      background:linear-gradient(135deg,#1cc88a 0%,#17a673 100%) !important;
      color:#fff !important;border-color:#1cc88a !important;animation:pulseCorrect .5s ease-in-out
    }
    .answer-btn.incorrect{
      background:linear-gradient(135deg,#e74a3b 0%,#c0352b 100%) !important;
      color:#fff !important;border-color:#e74a3b !important;animation:shake .5s ease-in-out
    }
    .answer-btn.selected{
      border-color:#4e73df !important;border-width:3px !important;
      box-shadow:0 0 0 3px rgba(78,115,223,.3) !important
    }
    @keyframes pulseCorrect{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

    /* =========================
       AVATAR STYLING
    ========================= */
    #player1Avatar, #player2Avatar{
      width: 80px !important;
      height: 80px !important;
      border-radius: 50% !important;
      object-fit: cover !important;
      border: 4px solid white !important;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2) !important;
      display: block !important;
    }
  </style>
</head>

<body>
<div class="game-container py-4">

  <!--
    ============================================================
    SECTION: GAME HEADER
    - Links: eigener Spieler (Avatar, Name, Score)
    - Mitte: "VS", Kategorie, Rundenanzeige
    - Rechts: Gegner (Avatar, Name, Score)
    ============================================================
  -->
  <div class="row mb-4">
    <div class="col-4">
      <div class="player-panel player1-panel text-center">
        <img id="player1Avatar"
             src="/images/default-avatar.png"
             class="player-avatar mb-2"
             alt="Spieler 1"
             onerror="this.onerror=null; this.src='/images/default-avatar.png';">
        <h5 id="player1Name">Du</h5>
        <div class="score-display" id="player1Score">0</div>
        <small>Punkte</small>
      </div>
    </div>

    <div class="col-4 text-center d-flex flex-column justify-content-center">
      <h2 class="mb-0">VS</h2>
      <small class="text-muted" id="gameCategory">Kategorie</small>
      <div class="mt-2">
        <span class="badge bg-primary" id="currentRound">Runde 1/5</span>
      </div>
    </div>

    <div class="col-4">
      <div class="player-panel player2-panel text-center">
        <img id="player2Avatar"
             src="/images/default-avatar.png"
             class="player-avatar mb-2"
             alt="Spieler 2"
             onerror="this.onerror=null; this.src='/images/default-avatar.png';">
        <h5 id="player2Name">Gegner</h5>
        <div class="score-display" id="player2Score">0</div>
        <small>Punkte</small>
      </div>
    </div>
  </div>

  <!--
    ============================================================
    SECTION: QUESTION CARD
    - Anzeige der aktuellen Frage + Kategorie
    - Antwortbuttons A-D
    - Timer (Balken + Text)
    ============================================================
  -->
  <div class="question-card">
    <div class="text-center mb-4">
      <h3 id="questionCategory" class="badge bg-secondary">kategorie</h3>
      <h2 id="questionText" class="mt-4 mb-4">Lade Frage...</h2>
    </div>

    <!-- Antworten A–D: data-answer wird im JS als "A"/"B"/"C"/"D" verwendet -->
    <div class="answers-grid mb-4">
      <button class="answer-btn btn btn-light" data-answer="A" id="answerA">A: ...</button>
      <button class="answer-btn btn btn-light" data-answer="B" id="answerB">B: ...</button>
      <button class="answer-btn btn btn-light" data-answer="C" id="answerC">C: ...</button>
      <button class="answer-btn btn btn-light" data-answer="D" id="answerD">D: ...</button>
    </div>

    <!-- Timer -->
    <div class="timer-bar">
      <div id="timerProgress" class="timer-progress" style="width: 100%"></div>
    </div>
    <div class="text-center mb-4">
      <span id="timeLeft" class="fw-bold">30</span> Sekunden verbleibend
    </div>
  </div>

  <!--
    ============================================================
    SECTION: CONTROLS
    - "Antwort absenden": wird erst aktiv, wenn eine Antwort ausgewählt wurde
    - "Nächste Runde": erscheint nach RoundResult, wenn noch Runden übrig sind
    ============================================================
  -->
  <div class="text-center mt-4">
    <button id="submitAnswerBtn" class="btn btn-primary btn-lg px-5" disabled>
      Antwort absenden
    </button>
    <button id="nextRoundBtn" class="btn btn-success btn-lg px-5 d-none">
      Nächste Runde →
    </button>
  </div>

  <!--
    ============================================================
    SECTION: GAME LOG
    - Kleines Log für Status/Debug (z.B. "Verbunden", "Runde beendet")
    ============================================================
  -->
  <div class="card mt-4">
    <div class="card-header">
      <h5 class="mb-0">📝 Spielverlauf</h5>
    </div>
    <div class="card-body" style="max-height: 200px; overflow-y: auto;">
      <div id="gameLog"></div>
    </div>
  </div>
</div>

<!--
  ============================================================
  OVERLAY: COUNTDOWN
  - wird angezeigt, wenn Backend COUNTDOWN-Events sendet
  ============================================================
-->
<div id="countdownOverlay" class="countdown-overlay d-none">
  <div class="countdown-number" id="countdownDisplay">3</div>
</div>

<!--
  ============================================================
  OVERLAY: GAME RESULT
  - wird nach GAME_END oder nach "gameFinished" eingeblendet
  ============================================================
-->
<div id="gameResultModal" class="game-result-modal d-none">
  <div class="result-card">
    <h1 id="resultTitle" class="mb-4">Spiel beendet!</h1>
    <div class="display-1 mb-4" id="resultIcon">🏆</div>
    <h3 id="resultMessage">Ergebnis wird berechnet...</h3>
    <div class="mt-4">
      <div class="row">
        <div class="col-6">
          <h5 id="finalScorePlayer1">0</h5>
          <small>Deine Punkte</small>
        </div>
        <div class="col-6">
          <h5 id="finalScorePlayer2">0</h5>
          <small>Gegner Punkte</small>
        </div>
      </div>
    </div>
    <div class="mt-5">
      <button onclick="returnToLobby()" class="btn btn-primary btn-lg me-3">
        Zurück zur Lobby
      </button>
      <button onclick="playAgain()" class="btn btn-success btn-lg">
        Nochmal spielen
      </button>
    </div>
  </div>
</div>

<script>
  /* =====================================================================
     JSDOC TYPE DEFINITIONS
     ---------------------------------------------------------------------
     Diese Typdefinitionen helfen beim Verständnis der Datenstrukturen,
     die vom Backend per REST oder WebSocket kommen.
     ===================================================================== */

  /**
   * @typedef {Object} Player
   * @property {number} id
   * @property {string} username
   * @property {string} [profileImageUrl]
   * @property {number} [totalGames]
   * @property {number} [gamesWon]
   * @property {number} [gamesLost]
   * @property {number} [highscore]
   */

  /**
   * @typedef {Object} QuestionPublic
   * @property {number} id
   * @property {string} category
   * @property {string} questionText
   * @property {string} optionA
   * @property {string} optionB
   * @property {string} optionC
   * @property {string} optionD
   */

  /**
   * @typedef {Object} Game
   * @property {number} [id]
   * @property {number} [gameId]
   * @property {Player} [player1]
   * @property {Player} [player2]
   * @property {string} [category]
   * @property {number} [scorePlayer1]
   * @property {number} [scorePlayer2]
   */

  /**
   * @typedef {Object} ScoresPayload
   * @property {number} player1
   * @property {number} player2
   */

  /**
   * @typedef {Object} RoundResultPayload
   * @property {number} gameId
   * @property {number} roundNumber
   * @property {string} correctAnswer
   * @property {number} player1Points
   * @property {number} player2Points
   * @property {string} message
   * @property {boolean} gameFinished
   */

  /**
   * @typedef {Object} TimerStartMessage
   * @property {"TIMER_START"} type
   * @property {number} gameId
   * @property {number} roundNumber
   * @property {number} timeLimit
   */

  /**
   * @typedef {Object} TimerUpdateMessage
   * @property {"TIMER_UPDATE"} type
   * @property {number} gameId
   * @property {number} roundNumber
   * @property {number} remainingSeconds
   */

  /* =========================
     GLOBAL STATE
  ========================= */

  /** @type {any} STOMP client instance (from stomp.js) */
  let stompClient = null;

  /** @type {Game|null} Aktuelles Spielobjekt */
  let currentGame = null;

  /** @type {Player|null} Aktuell eingeloggter Spieler */
  let currentPlayer = null;

  /** @type {number} Aktuelle Runde (1..TOTAL_ROUNDS) */
  let currentRound = 1;

  /** @type {number} Anzahl Runden im Spiel (muss zum Backend passen) */
  const TOTAL_ROUNDS = 5;

  /**
   * @type {boolean}
   * true = currentPlayer ist game.player1, false = currentPlayer ist game.player2
   */
  let isPlayer1 = true;

  /** @type {Player|null} Gegner-Spielerobjekt (aus currentGame abgeleitet) */
  let opponentPlayer = null;

  /** @type {"A"|"B"|"C"|"D"|null} aktuell ausgewählte Antwort */
  let selectedAnswer = null;

  /** @type {boolean} verhindert mehrfaches Absenden pro Runde */
  let answerSent = false;

  /** @type {number|null} wird aktuell nicht genutzt (kann für client-side timer genutzt werden) */
  let timerInterval = null;

  /** @type {number} verbleibende Sekunden für die Runde */
  let timeLeft = 30;

  /** @type {boolean} initialer Sync nur einmal nach WS Connect */
  let didInitialSync = false;

  /** @type {number} verhindert mehrfaches Frage-Sync pro Runde */
  let didQuestionSyncRound = 0;

  /** @type {boolean} schützt davor, endGame mehrmals auszuführen */
  let didEndGame = false;

  /** @type {string} Fallback Avatar */
  const DEFAULT_AVATAR = "/images/default-avatar.png";

  /* =========================
     DOM HELPERS
  ========================= */

  /**
   * Shortcut: Element per ID holen
   * @param {string} id
   * @returns {HTMLElement|null}
   */
  const $ = id => document.getElementById(id);

  /**
   * Shortcut: Elements per Selector holen
   * @param {string} sel
   * @returns {NodeListOf<HTMLElement>}
   */
  const $$ = sel => document.querySelectorAll(sel);

  /**
   * Entfernt Bootstrap-Klasse d-none (anzeigen)
   * @param {string} id
   * @returns {void}
   */
  const show = id => $(id)?.classList.remove("d-none");

  /**
   * Fügt Bootstrap-Klasse d-none hinzu (verstecken)
   * @param {string} id
   * @returns {void}
   */
  const hide = id => $(id)?.classList.add("d-none");

  /**
   * Setzt textContent, falls Element existiert
   * @param {string} id
   * @param {string|number} text
   * @returns {void}
   */
  const setText = (id, text) => { const el = $(id); if (el) el.textContent = String(text); };

  /**
   * Häufig verwendete DOM-Elemente als Cache (kleiner Performance- und Lesbarkeitsgewinn)
   */
  const elements = {
    submitAnswerBtn: $("submitAnswerBtn"),
    nextRoundBtn: $("nextRoundBtn"),
    timerProgress: $("timerProgress"),
    timeLeft: $("timeLeft"),

    player1Score: $("player1Score"),
    player2Score: $("player2Score"),
    player1Avatar: $("player1Avatar"),
    player2Avatar: $("player2Avatar"),

    gameLog: $("gameLog")
  };

  /* =========================
     IMAGE HELPERS (DEFAULT)
  ========================= */

  /**
   * Liefert eine Avatar-URL oder das Default-Bild.
   * @param {string|null|undefined} url
   * @returns {string}
   */
  function safeImg(url) {
    const u = (url || "").trim();
    return u ? u : DEFAULT_AVATAR;
  }

  /**
   * Setzt das Avatarbild sicher (inkl. onerror Fallback).
   * @param {HTMLImageElement|null} imgEl
   * @param {string|null|undefined} url
   * @returns {void}
   */
  function setAvatar(imgEl, url) {
    if (!imgEl) return;
    imgEl.onerror = () => {
      imgEl.onerror = null;
      imgEl.src = DEFAULT_AVATAR;
    };
    imgEl.src = safeImg(url);
  }

  /* =========================
     GAME ID HELPERS (id vs gameId)
  ========================= */

  /**
   * Normalisiert Game-ID, da manche Payloads id oder gameId enthalten.
   * @param {Game|null|undefined} g
   * @returns {number|null}
   */
  function getGameIdFromObject(g) {
    return g?.id ?? g?.gameId ?? null;
  }

  /**
   * Liefert die Game-ID:
   * - Priorität 1: URL query (?gameId=...)
   * - Priorität 2: currentGame Objekt
   * - Priorität 3: localStorage.currentGame
   * @returns {string|number|null}
   */
  function getGameId() {
    const urlId = new URLSearchParams(location.search).get("gameId");
    if (urlId) return urlId;

    const id = getGameIdFromObject(currentGame);
    if (id) return id;

    const saved = localStorage.getItem("currentGame");
    if (saved) {
      try {
        const g = JSON.parse(saved);
        return getGameIdFromObject(g);
      } catch {}
    }
    return null;
  }

  /* =========================
     INIT
  ========================= */

  // Startpunkt: wenn DOM geladen ist -> Daten laden
  window.onload = () => loadGameData();

  /**
   * Lädt Player/Game aus localStorage/Backend und startet WebSocket + UI Events.
   * @returns {Promise<void>}
   */
  async function loadGameData() {
    currentPlayer = JSON.parse(localStorage.getItem("currentPlayer"));
    if (!currentPlayer) return redirectLobby();

    setText("player1Name", currentPlayer.username || "Du");
    setAvatar(elements.player1Avatar, currentPlayer.profileImageUrl);

    const gameId = new URLSearchParams(location.search).get("gameId");
    if (gameId) await fetchGameData(gameId);
    else loadGameFromStorage();

    const id = getGameId();
    if (!id) {
      console.error("❌ Keine Game-ID gefunden (id/gameId). currentGame=", currentGame);
      return redirectLobby();
    }

    connectWebSocket();
    setupEventListeners();
  }

  /**
   * Navigiert zurück zur Lobby (leicht verzögert, um UI nicht abrupt zu cutten).
   * @returns {void}
   */
  function redirectLobby() {
    setTimeout(() => (location.href = "/lobby.html"), 800);
  }

  /**
   * Lädt currentGame aus localStorage (Fallback, wenn kein gameId in URL).
   * @returns {void}
   */
  function loadGameFromStorage() {
    const saved = localStorage.getItem("currentGame");
    if (!saved) return redirectLobby();

    currentGame = JSON.parse(saved);
    updateGameDisplay();
    applyPlayerRolesFromGame();
  }

  /* =========================
     GAME FETCH
  ========================= */

  /**
   * Lädt Game-Daten vom Backend und aktualisiert localStorage + UI.
   * @param {string|number} gameId
   * @returns {Promise<void>}
   */
  async function fetchGameData(gameId) {
    try {
      const res = await fetch(`/api/games/${gameId}`, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);

      currentGame = await res.json();
      localStorage.setItem("currentGame", JSON.stringify(currentGame));

      updateGameDisplay();
      applyPlayerRolesFromGame();
    } catch (e) {
      console.error("❌ fetchGameData:", e);
      redirectLobby();
    }
  }

  /**
   * Heuristik: erkennt ob im UI noch keine echte Frage/Antworttexte stehen.
   * @returns {boolean}
   */
  function questionLooksMissing() {
    const qText = $("questionText")?.textContent?.trim() || "";
    const aText = $("answerA")?.textContent?.trim() || "";
    return (
      qText === "" || qText.includes("???") || qText.includes("Lade") ||
      aText === "" || aText.includes("...")
    );
  }

  /**
   * Wenn nach Refresh keine Frage im UI ist:
   * - holt alle Runden
   * - nimmt die "neueste" Runde (höchste roundNumber)
   * - rendert die Frage dieser Runde
   *
   * @param {string|number} gameId
   * @returns {Promise<void>}
   */
  async function syncFirstQuestionIfMissing(gameId) {
    if (!questionLooksMissing()) return;

    const rounds = await fetch(`/api/games/${gameId}/rounds`, { cache: "no-store" }).then(r => r.json());
    const last = rounds.reduce((best, r) => (!best || r.roundNumber > best.roundNumber ? r : best), null);

    if (last?.question) {
      currentRound = last.roundNumber;
      setText("currentRound", `Runde ${currentRound}/${TOTAL_ROUNDS}`);
      displayQuestion(last.question);
    }
  }

  /* =========================
     WEBSOCKET
  ========================= */

  /**
   * Baut die WebSocket-Verbindung auf (SockJS + STOMP) und subscribed danach auf Topics.
   * @returns {void}
   */
  function connectWebSocket() {
    const socket = new SockJS("/quiz-websocket");
    stompClient = Stomp.over(socket);
    stompClient.debug = null;

    stompClient.connect({}, () => {
      addGameLog("✅ Verbunden");
      subscribeAll();
    }, () => setTimeout(connectWebSocket, 5000));
  }

  /**
   * Helper: subscribed auf Topic und gibt geparstes JSON an handler.
   * @param {string} topic
   * @param {(data:any)=>void} handler
   * @returns {any}
   */
  const subscribe = (topic, handler) =>
    stompClient.subscribe(topic, msg => handler(JSON.parse(msg.body)));

  /**
   * Registriert alle notwendigen Subscriptions für dieses Spiel.
   * @returns {void}
   */
  function subscribeAll() {
    const id = getGameId();
    if (!id) return console.error("❌ subscribeAll: keine Game-ID");

    console.log("🔌 Subscriptions für Spiel:", id);

    subscribe(`/topic/game/${id}`, handleGameMessage);
    subscribe(`/topic/game/${id}/timer`, handleTimerMessage);

    subscribe(`/topic/game/${id}/countdown`, d => {
      if (d.type === "COUNTDOWN") showCountdown(d.seconds);
    });

    subscribe(`/topic/game/${id}/result`, d => {
      showRoundResult(d.result);
      updateScores(d.scores);

      if (d.scores) {
        currentGame.scorePlayer1 = d.scores.player1;
        currentGame.scorePlayer2 = d.scores.player2;
        localStorage.setItem("currentGame", JSON.stringify(currentGame));
      }

      if (d?.result?.gameFinished === true && !didEndGame) {
        didEndGame = true;
        endGame({ scores: d.scores });
      }
    });

    if (!didInitialSync) {
      didInitialSync = true;
      applyPlayerRolesFromGame();
      syncFirstQuestionIfMissing(id);
    }
  }

  /* =========================
     TIMER
  ========================= */

  /**
   * Aktualisiert Timer-Text + Progressbar.
   * (Hinweis: Progress basiert auf 30s fix. Für variable Limits müsste man skalieren.)
   * @returns {void}
   */
  function updateTimer() {
    setText("timeLeft", timeLeft);
    elements.timerProgress.style.width = `${(timeLeft / 30) * 100}%`;
  }

  /**
   * Stoppt ggf. einen clientseitigen Timer (derzeit nicht aktiv genutzt).
   * @returns {void}
   */
  function stopTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = null;
  }

  /**
   * Verarbeitet TIMER_START / TIMER_UPDATE.
   * @param {TimerStartMessage|TimerUpdateMessage|any} data
   * @returns {void}
   */
  function handleTimerMessage(data) {
    if (!data) return;

    if (data.type === "TIMER_START") {
      timeLeft = data.timeLimit ?? 30;
      updateTimer();
      return;
    }

    if (data.type === "TIMER_UPDATE") {
      timeLeft = Number(data.remainingSeconds ?? timeLeft);
      updateTimer();

      const rn = data.roundNumber ?? 0;
      const id = getGameId();

      // Fallback: wenn Frage fehlt, hole Game frisch (max. 1x pro Runde)
      if (didQuestionSyncRound !== rn && questionLooksMissing() && id) {
        didQuestionSyncRound = rn;
        fetchGameData(id);
      }
    }
  }

  /* =========================
     GAME FLOW
  ========================= */

  /**
   * Router für Messages vom Game-Topic.
   * @param {any} data
   * @returns {void}
   */
  function handleGameMessage(data) {
    console.log("📨", data.type, data);

    const handlers = {
      GAME_START: () => showGameStart(data),
      ROUND_START: () => startNewRound(data),
      OPPONENT_ANSWERED: opponentAnswered,
      GAME_END: () => endGame(data)
    };

    handlers[data.type]?.();
  }

  /**
   * Start einer neuen Runde:
   * - UI reset
   * - Runde setzen
   * - Frage anzeigen (oder fallback fetch)
   *
   * @param {any} data
   * @returns {void}
   */
  function startNewRound(data) {
    resetRound();
    currentRound = data.roundNumber || currentRound;
    setText("currentRound", `Runde ${currentRound}/${TOTAL_ROUNDS}`);

    const q = data.question || data.round?.question;
    if (q) displayQuestion(q);
    else {
      setText("questionText", "Lade Frage...");
      const id = getGameId();
      if (id) fetchGameData(id);
    }
  }

  /**
   * Rendert eine Frage in die UI (ohne korrekte Antwort).
   * @param {QuestionPublic} q
   * @returns {void}
   */
  function displayQuestion(q) {
    setText("questionText", q.questionText || "??? Keine Frage geladen ???");
    setText("questionCategory", q.category || "Kategorie");

    ["A","B","C","D"].forEach(l => setText(`answer${l}`, `${l}: ${q["option"+l]}`));
    elements.submitAnswerBtn.disabled = true;
  }

  /**
   * Markiert eine Antwort als ausgewählt und aktiviert "Absenden".
   * @param {"A"|"B"|"C"|"D"} letter
   * @returns {void}
   */
  function selectAnswer(letter) {
    selectedAnswer = letter;
    elements.submitAnswerBtn.disabled = false;

    $$(".answer-btn").forEach(btn =>
      btn.classList.toggle("selected", btn.dataset.answer === letter)
    );
  }

  /**
   * Sendet eine Antwort an den Server (nur 1x pro Runde).
   * @param {"A"|"B"|"C"|"D"} answer
   * @returns {void}
   */
  function sendAnswerToServer(answer) {
    if (answerSent) return;
    answerSent = true;

    stompClient.send("/app/game.answer", {}, JSON.stringify({
      gameId: getGameId(),
      playerId: currentPlayer.id,
      roundNumber: currentRound,
      answer
    }));

    elements.submitAnswerBtn.disabled = true;
    $$(".answer-btn").forEach(b => b.disabled = true);
  }

  /* =========================
     RESULTS
  ========================= */

  /**
   * Markiert Buttons korrekt/falsch, stoppt Timer und zeigt ggf. "Next round".
   * @param {RoundResultPayload} result
   * @returns {void}
   */
  function showRoundResult(result) {
    if (!result) return;

    const correctLetter = result.correctAnswer;

    $$(".answer-btn").forEach(btn => {
      const a = btn.dataset.answer;
      btn.classList.toggle("correct", a === correctLetter);
      btn.classList.toggle("incorrect", a === selectedAnswer && a !== correctLetter);
      btn.disabled = true;
    });

    stopTimer();
    if (currentRound < TOTAL_ROUNDS) show("nextRoundBtn");
    addGameLog(result.message || `Runde ${currentRound} beendet!`);
  }

  /**
   * Trigger für nächste Runde (Backend startet neue Runde und broadcastet ROUND_START).
   * @returns {void}
   */
  function nextRound() {
    hide("nextRoundBtn");
    stompClient.send("/app/game.nextRound", {}, JSON.stringify({
      gameId: getGameId(),
      roundNumber: currentRound + 1
    }));
  }

  /**
   * Zeigt Spielende-Overlay inkl. Winner-Status.
   * @param {{scores?: ScoresPayload}|any} data
   * @returns {void}
   */
  function endGame(data) {
    stopTimer();
    if (data?.scores) updateScores(data.scores);

    const my = +$("player1Score")?.textContent || 0;
    const opp = +$("player2Score")?.textContent || 0;

    setText("finalScorePlayer1", my);
    setText("finalScorePlayer2", opp);

    if (my > opp) {
      setText("resultTitle", "Gewonnen!");
      setText("resultIcon", "🏆");
      setText("resultMessage", "Stark gespielt!");
    } else if (opp > my) {
      setText("resultTitle", "Verloren");
      setText("resultIcon", "😔");
      setText("resultMessage", "Kopf hoch – nächstes Spiel!");
    } else {
      setText("resultTitle", "Unentschieden");
      setText("resultIcon", "🤝");
      setText("resultMessage", "Gutes Match!");
    }

    show("gameResultModal");
  }

  /* =========================
     UI HELPERS
  ========================= */

  /**
   * Optionaler UI-Indikator: Gegner hat geantwortet.
   * Hinweis: Element existiert in dieser HTML aktuell nicht, daher null-check.
   * @returns {void}
   */
  function opponentAnswered() {
    const el = $("opponentAnswerStatus");
    if (!el) return;
    el.textContent = "✓";
    el.classList.add("answered");
  }

  /**
   * Aktualisiert die Score-Anzeige (myScore links, opponent rechts).
   * @param {ScoresPayload|any} scores
   * @returns {void}
   */
  function updateScores(scores = {}) {
    if (!scores) return;

    const my = isPlayer1 ? scores.player1 : scores.player2;
    const opp = isPlayer1 ? scores.player2 : scores.player1;

    if (my !== undefined) setText("player1Score", my);
    if (opp !== undefined) setText("player2Score", opp);
  }

  /**
   * Zeigt/aktualisiert den Countdown-Overlay.
   * @param {number} seconds
   * @returns {void}
   */
  function showCountdown(seconds) {
    setText("countdownDisplay", seconds);
    show("countdownOverlay");
    if (seconds <= 0) setTimeout(() => hide("countdownOverlay"), 1000);
  }

  /**
   * Verarbeitet GAME_START: Kategorie, Gegnerdaten, erste Frage (falls vorhanden).
   * @param {any} data
   * @returns {void}
   */
  function showGameStart(data) {
    setText("gameCategory", data.category || "Kategorie");

    const p2 = data.player2 || data.opponent;
    if (p2) {
      setText("player2Name", p2.username || "Gegner");
      setAvatar(elements.player2Avatar, p2.profileImageUrl);
    }

    const q = data.question || data.round?.question;
    if (q) {
      currentRound = 1;
      setText("currentRound", `Runde ${currentRound}/${TOTAL_ROUNDS}`);
      displayQuestion(q);
    } else {
      console.warn("⚠️ GAME_START ohne Frage – warte auf ROUND_START...");
    }
  }

  /* =========================
     RESET & EVENTS
  ========================= */

  /**
   * Reset des UI-Zustands für eine neue Runde.
   * @returns {void}
   */
  function resetRound() {
    selectedAnswer = null;
    answerSent = false;
    hide("nextRoundBtn");
    stopTimer();

    $$(".answer-btn").forEach(btn => {
      btn.className = "answer-btn btn btn-light";
      btn.disabled = false;
    });

    elements.submitAnswerBtn.disabled = true;
  }

  /**
   * Verknüpft Buttons mit JS-Handlers.
   * @returns {void}
   */
  function setupEventListeners() {
    $$(".answer-btn").forEach(btn =>
      btn.addEventListener("click", () => selectAnswer(btn.dataset.answer))
    );

    elements.submitAnswerBtn.addEventListener("click", () => {
      if (selectedAnswer) sendAnswerToServer(selectedAnswer);
    });

    elements.nextRoundBtn.addEventListener("click", nextRound);
  }

  /* =========================
     DISPLAY & LOG
  ========================= */

  /**
   * Aktualisiert Header-Anzeige (Spieler, Avatare, Kategorie).
   * @returns {void}
   */
  function updateGameDisplay() {
    if (!currentGame || !currentPlayer) return;

    const p1 = currentGame.player1;
    const p2 = currentGame.player2;

    const iAmP1 = p1 && p1.id === currentPlayer.id;
    const me = iAmP1 ? p1 : p2;
    const opp = iAmP1 ? p2 : p1;

    if (me) {
      setText("player1Name", me.username);
      setAvatar(elements.player1Avatar, me.profileImageUrl);
    } else {
      setText("player1Name", currentPlayer.username || "Du");
      setAvatar(elements.player1Avatar, currentPlayer.profileImageUrl);
    }

    if (opp) {
      setText("player2Name", opp.username || "Gegner");
      setAvatar(elements.player2Avatar, opp.profileImageUrl);
    } else {
      setText("player2Name", "Warte auf Gegner...");
      setAvatar(elements.player2Avatar, null);
    }

    setText("gameCategory", currentGame.category || "Kategorie");
  }

  /**
   * Bestimmt Rollen (bin ich player1?) und setzt Scores korrekt.
   * @returns {void}
   */
  function applyPlayerRolesFromGame() {
    if (!currentGame?.player1 || !currentGame?.player2 || !currentPlayer?.id) return;

    isPlayer1 = currentGame.player1.id === currentPlayer.id;
    opponentPlayer = isPlayer1 ? currentGame.player2 : currentGame.player1;

    setText("player1Name", currentPlayer.username || "Du");
    setAvatar(elements.player1Avatar, currentPlayer.profileImageUrl);

    setText("player2Name", opponentPlayer?.username || "Gegner");
    setAvatar(elements.player2Avatar, opponentPlayer?.profileImageUrl);

    const myScore = isPlayer1 ? currentGame.scorePlayer1 : currentGame.scorePlayer2;
    const oppScore = isPlayer1 ? currentGame.scorePlayer2 : currentGame.scorePlayer1;

    if (myScore != null) setText("player1Score", myScore);
    if (oppScore != null) setText("player2Score", oppScore);
  }

  /**
   * Schreibt eine Nachricht in das GameLog (mit Uhrzeit) und scrollt nach unten.
   * @param {string} message
   * @returns {void}
   */
  function addGameLog(message) {
    const div = document.createElement("div");
    div.innerHTML = `<small>[${new Date().toLocaleTimeString()}]</small> ${message}`;
    elements.gameLog.appendChild(div);
    elements.gameLog.scrollTop = elements.gameLog.scrollHeight;
  }

  /* =========================
     NAV
  ========================= */

  /**
   * Zurück zur Lobby: Game-Status aus localStorage entfernen.
   * @returns {void}
   */
  function returnToLobby() {
    localStorage.removeItem("currentGame");
    localStorage.removeItem("autoJoinCategory");
    location.href = "/lobby.html";
  }

  /**
   * Nochmal spielen:
   * - currentGame entfernen
   * - Kategorie merken (autoJoinCategory), damit Lobby automatisch joinen kann
   * @returns {void}
   */
  function playAgain() {
    localStorage.removeItem("currentGame");
    localStorage.setItem("autoJoinCategory", currentGame?.category || "sport");
    location.href = "/lobby.html";
  }
</script>

</body>
</html>

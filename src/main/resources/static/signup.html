<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrieren - QuizDuell</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <style>
    .container-center {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }
    .profile-preview {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid #dee2e6;
        margin: 10px auto;
        display: block;
    }
    .upload-area {
        border: 2px dashed #dee2e6;
        border-radius: 10px;
        padding: 20px;
        text-align: center;
        cursor: pointer;
        transition: border-color 0.3s;
    }
    .upload-area:hover {
        border-color: #007bff;
    }
    .upload-area.dragover {
        border-color: #007bff;
        background-color: #f8f9fa;
    }
  </style>
</head>
<body class="bg-light">
<div class="container-center">
  <div class="card p-4 shadow" style="max-width: 500px; width: 100%;">
    <h3 class="mb-3 text-center">Spieler Registrieren</h3>

    <div id="errorMessage" class="alert alert-danger d-none"></div>
    <div id="successMessage" class="alert alert-success d-none"></div>

    <form id="signupForm">
      <!-- Profilbild Upload -->
      <div class="mb-4 text-center">
        <label class="form-label d-block">Profilbild</label>

        <div class="upload-area" id="uploadArea">
          <img id="profilePreview" src="/images/default-avatar.jpg" class="profile-preview mb-2"
               alt="Profilbild Vorschau">
          <p class="mb-1">Klicken zum Hochladen oder Bild hierher ziehen</p>
          <small class="text-muted">Max. 10MB (JPG, PNG, GIF)</small>
          <input type="file" id="profileImage" accept="image/*" class="d-none">
        </div>
        <input type="hidden" id="profileImageUrl" value="/images/default-avatar.jpg">
      </div>

      <!-- Benutzername und Passwort -->
      <div class="mb-3">
        <label for="username" class="form-label">Benutzername *</label>
        <input type="text" class="form-control" id="username" placeholder="Benutzername" required>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Passwort *</label>
        <input type="password" class="form-control" id="password" required>
      </div>

      <button type="submit" class="btn btn-primary w-100">Registrieren</button>
    </form>

    <div class="text-center mt-3">
      <a href="/index.html" class="text-decoration-none">← Zurück zur Startseite</a>
    </div>
  </div>
</div>

<script>
  const uploadArea = document.getElementById('uploadArea');
  const fileInput = document.getElementById('profileImage');
  const profilePreview = document.getElementById('profilePreview');
  const profileImageUrl = document.getElementById('profileImageUrl');
  const errorDiv = document.getElementById('errorMessage');
  const successDiv = document.getElementById('successMessage');

  // Klick auf Upload-Bereich
  uploadArea.addEventListener('click', () => {
      fileInput.click();
  });

  // Drag & Drop Funktionen
  uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
  });

  uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
  });

  uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');

      if (e.dataTransfer.files.length > 0) {
          handleImageUpload(e.dataTransfer.files[0]);
      }
  });

  // Datei auswählen
  fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
          handleImageUpload(e.target.files[0]);
      }
  });

  // Bild-Upload verarbeiten
  function handleImageUpload(file) {
      // Dateityp prüfen
      if (!file.type.startsWith('image/')) {
          showError('Bitte nur Bild-Dateien hochladen!');
          return;
      }

      // Dateigröße prüfen (2MB)
      if (file.size > 10 * 1024 * 1024) {
          showError('Datei zu groß! Maximal 10MB erlaubt.');
          return;
      }

      // Vorschau anzeigen
      const reader = new FileReader();
      reader.onload = (e) => {
          profilePreview.src = e.target.result;
      };
      reader.readAsDataURL(file);

      // Datei hochladen
      uploadFile(file);
  }

  // Datei zum Server hochladen
  function uploadFile(file) {
      const formData = new FormData();
      formData.append('file', file);

      fetch('/api/upload/profile-image', {
  method: 'POST',
  body: formData
})
.then(async (response) => {
  const text = await response.text().catch(() => '');
  if (!response.ok) {
    throw new Error(`HTTP ${response.status} - ${text || 'Upload fehlgeschlagen'}`);
  }
  return text;
})
.then(fileUrl => {
  profileImageUrl.value = fileUrl;
  showSuccess('Profilbild erfolgreich hochgeladen!');
})
.catch(error => {
  showError('Upload fehlgeschlagen: ' + error.message);
  profileImageUrl.value = '/images/default-avatar.jpg';
});

  }

  // Registrierung verarbeiten
  document.getElementById('signupForm').addEventListener('submit', function(event) {
      event.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const imageUrl = profileImageUrl.value;

      // Fehler-Meldungen verstecken
      hideMessages();

      // Spieler über REST API erstellen
      fetch('/api/players', {
          method: 'POST',
          headers: {
              'Content-Type': 'application/json',
          },
          body: JSON.stringify({
              username: username,
              password: password,
              profileImageUrl: imageUrl
          })
      })
      .then(response => {
          if (response.status === 400) {
              throw new Error('Benutzername existiert bereits!');
          }
          if (!response.ok) {
              throw new Error('Registrierung fehlgeschlagen!');
          }
          return response.json();
      })
      .then(player => {
          showSuccess(`✅ Erfolgreich registriert! Spieler: ${player.username}`);

          // Nach 2 Sekunden weiterleiten
          setTimeout(() => {
              window.location.href = '/signup_success.html?username=' + encodeURIComponent(player.username);
          }, 2000);
      })
      .catch(error => {
          showError('❌ ' + error.message);
      });
  });

  // Hilfsfunktionen
  function showError(message) {
      errorDiv.textContent = message;
      errorDiv.classList.remove('d-none');
      successDiv.classList.add('d-none');
  }

  function showSuccess(message) {
      successDiv.textContent = message;
      successDiv.classList.remove('d-none');
      errorDiv.classList.add('d-none');
  }

  function hideMessages() {
      errorDiv.classList.add('d-none');
      successDiv.classList.add('d-none');
  }
</script>
</body>
</html>

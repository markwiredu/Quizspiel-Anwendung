<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizDuell - Rangliste</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
        background-color: #f8f9fa;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .leaderboard-container {
        max-width: 1000px;
        margin: 0 auto;
        padding: 20px;
    }

    .header-card {
        background: linear-gradient(135deg, #ffd700 0%, #ffaa00 100%);
        color: #333;
        border-radius: 15px;
        padding: 30px;
        text-align: center;
        margin-bottom: 30px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }

    .trophy-icon {
        font-size: 4rem;
        margin-bottom: 20px;
    }

    .player-row {
        background: white;
        border-radius: 10px;
        padding: 15px 20px;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        transition: transform 0.2s ease;
    }

    .player-row:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .player-row.current-player {
        background: #e8f4fd;
        border-left: 5px solid #4e73df;
    }

    .rank {
        font-size: 1.5rem;
        font-weight: bold;
        min-width: 60px;
        text-align: center;
    }

    .rank-1 { color: #ffd700; }
    .rank-2 { color: #c0c0c0; }
    .rank-3 { color: #cd7f32; }
    .rank-other { color: #6c757d; }

    .player-avatar {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        object-fit: cover;
        margin-right: 15px;
    }

    .player-info {
        flex-grow: 1;
    }

    .player-name {
        font-weight: bold;
        font-size: 1.1rem;
    }

    .player-stats {
        color: #6c757d;
        font-size: 0.9rem;
    }

    .win-badge {
        background: #1cc88a;
        color: white;
        padding: 5px 15px;
        border-radius: 20px;
        font-weight: bold;
        min-width: 80px;
        text-align: center;
    }

    .medal {
        font-size: 1.5rem;
        margin-right: 10px;
    }

    .loading {
        text-align: center;
        padding: 40px;
        color: #6c757d;
    }

    .btn-refresh {
        width: 100%;
        padding: 12px;
        margin-top: 20px;
        font-size: 1.1rem;
    }

    @media (max-width: 768px) {
        .leaderboard-container {
            padding: 10px;
        }

        .player-row {
            padding: 12px 15px;
        }

        .rank {
            min-width: 40px;
            font-size: 1.2rem;
        }

        .player-avatar {
            width: 40px;
            height: 40px;
        }

        .win-badge {
            min-width: 70px;
            padding: 4px 10px;
            font-size: 0.9rem;
        }
    }
  </style>
</head>
<body>
<div class="leaderboard-container">
  <!-- Header -->
  <div class="header-card">
    <div class="trophy-icon">🏆</div>
    <h1>QuizDuell Rangliste</h1>
    <p class="lead">Top Spieler nach Siegen</p>
  </div>

  <!-- Rangliste -->
  <div id="leaderboardContent">
    <div class="loading">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Lädt...</span>
      </div>
      <p class="mt-3">Lade Rangliste...</p>
    </div>
  </div>

  <!-- Aktualisieren-Button -->
  <button onclick="loadLeaderboard()" class="btn btn-success btn-refresh">
    🔄 Rangliste aktualisieren
  </button>

  <!-- Zurück-Button -->
  <a href="lobby.html" class="btn btn-secondary btn-refresh">
    ← Zurück zur Lobby
  </a>
</div>

<script>
  let currentPlayer = null;

  document.addEventListener('DOMContentLoaded', function() {
      loadPlayerData();
      loadLeaderboard();
  });

  function loadPlayerData() {
      const savedPlayer = localStorage.getItem('currentPlayer');
      if (savedPlayer) {
          try {
              currentPlayer = JSON.parse(savedPlayer);
          } catch (e) {
              console.error('Fehler beim Laden des Spielers:', e);
          }
      }
  }

  function loadLeaderboard() {
      const container = document.getElementById('leaderboardContent');
      container.innerHTML = `
          <div class="loading">
              <div class="spinner-border text-primary" role="status">
                  <span class="visually-hidden">Lädt...</span>
              </div>
              <p class="mt-3">Lade Rangliste...</p>
          </div>
      `;

      fetch('/api/stats/leaderboard')
          .then(response => {
              if (!response.ok) {
                  throw new Error('Rangliste nicht verfügbar');
              }
              return response.json();
          })
          .then(leaderboard => {
              renderLeaderboard(leaderboard);
          })
          .catch(error => {
              console.error('Fehler beim Laden der Rangliste:', error);
              container.innerHTML = `
                  <div class="alert alert-danger">
                      <h5>❌ Fehler</h5>
                      <p>Rangliste konnte nicht geladen werden.</p>
                      <button onclick="loadLeaderboard()" class="btn btn-primary btn-sm">
                          Erneut versuchen
                      </button>
                  </div>
              `;
          });
  }

  function renderLeaderboard(leaderboard) {
      const container = document.getElementById('leaderboardContent');

      if (!leaderboard || leaderboard.length === 0) {
          container.innerHTML = `
              <div class="alert alert-info">
                  <h5>🏆 Noch keine Rangliste</h5>
                  <p>Spiele dein erstes Spiel, um in der Rangliste zu erscheinen!</p>
              </div>
          `;
          return;
      }

      let html = '';

      leaderboard.forEach(entry => {
          // Prüfe ob das der aktuelle Spieler ist
          const isCurrentPlayer = currentPlayer && entry.playerId === currentPlayer.id;

          // Bestimme Rang-Klasse
          let rankClass = 'rank-other';
          if (entry.rank === 1) rankClass = 'rank-1';
          else if (entry.rank === 2) rankClass = 'rank-2';
          else if (entry.rank === 3) rankClass = 'rank-3';

          // Bestimme Medaille
          let medal = '';
          if (entry.rank === 1) medal = '🥇';
          else if (entry.rank === 2) medal = '🥈';
          else if (entry.rank === 3) medal = '🥉';

          html += `
              <div class="player-row ${isCurrentPlayer ? 'current-player' : ''}">
                  <div class="rank ${rankClass}">
                      ${medal} ${entry.rank}
                  </div>

                  <img src="${entry.profileImageUrl || '/images/default-avatar.jpg'}"
                       class="player-avatar"
                       alt="${entry.username}">

                  <div class="player-info">
                      <div class="player-name">
                          ${entry.username}
                          ${isCurrentPlayer ? '<span class="badge bg-primary ms-2">Du</span>' : ''}
                      </div>
                      <div class="player-stats">
                          ${entry.totalGames} Spiele • ${entry.winRate}% Gewinnrate
                      </div>
                  </div>

                  <div class="win-badge">
                      ${entry.gamesWon} Siege
                  </div>
              </div>
          `;
      });

      container.innerHTML = html;
  }
</script>
</body>
</html>

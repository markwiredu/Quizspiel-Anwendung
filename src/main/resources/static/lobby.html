<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobby - QuizDuell</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        .container-center {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .lobby-card {
            max-width: 500px;
            width: 100%;
        }
        .status-waiting { color: #856404; background-color: #fff3cd; border-color: #ffeaa7; }
        .status-matched { color: #155724; background-color: #d4edda; border-color: #c3e6cb; }
        .status-starting { color: #004085; background-color: #cce5ff; border-color: #b8daff; }
        .player-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
        }
        .queue-animation {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body class="bg-light">
<div class="container-center">
    <div class="card lobby-card p-4 shadow">
        <!-- Header -->
        <div class="text-center mb-4">
            <h3>🎮 QuizDuell Lobby</h3>
            <p class="text-muted">Finde einen Gegner und starte das Spiel!</p>
        </div>

        <!-- Spieler Info -->
        <div id="playerInfo" class="alert alert-info d-none">
            <strong>Eingeloggt als:</strong> <span id="currentPlayerName">-</span>
        </div>

        <!-- Kategorie Auswahl -->
        <div class="mb-4">
            <label class="form-label"><strong>Wähle eine Kategorie:</strong></label>
            <select class="form-select" id="categorySelect">
                <option value="ALL">Alle Kategorien</option>
                <option value="GEOGRAPHY">🌍 Geographie</option>
                <option value="SCIENCE">🔬 Wissenschaft</option>
                <option value="HISTORY">📜 Geschichte</option>
                <option value="SPORTS">⚽ Sport</option>
            </select>
        </div>

        <!-- Lobby Status -->
        <div id="lobbyStatus" class="alert alert-secondary text-center">
            <h5>👥 Warte auf Spielstart</h5>
            <p class="mb-0">Wähle eine Kategorie und betrete die Lobby</p>
        </div>

        <!-- Lobby Actions -->
        <div class="d-grid gap-2 mb-4">
            <button id="joinLobbyBtn" class="btn btn-primary btn-lg">
                🎯 Lobby betreten
            </button>
            <button id="leaveLobbyBtn" class="btn btn-outline-danger d-none">
                ❌ Lobby verlassen
            </button>
        </div>

        <!-- Queue Info -->
        <div id="queueInfo" class="card mb-3 d-none">
            <div class="card-body text-center">
                <div class="queue-animation">
                    <h5>🔍 Suche nach Gegner...</h5>
                    <div id="queuePosition" class="mb-2"></div>
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Match Info -->
        <div id="matchInfo" class="card mb-3 d-none">
            <div class="card-body text-center">
                <h5 class="text-success">🎉 Gegner gefunden!</h5>
                <div id="opponentInfo" class="my-3"></div>
                <p>Spiel startet in <span id="countdown">5</span> Sekunden...</p>
            </div>
        </div>

        <!-- Navigation -->
        <div class="text-center">
            <a href="/index.html" class="btn btn-outline-secondary">← Zur Startseite</a>
        </div>
    </div>
</div>

<script>
    // Global variables
    let stompClient = null;
    let currentPlayer = null;
    let currentCategory = 'ALL';
    let isInLobby = false;
    let gameStartCountdown = null;

    // Page loaded
    window.onload = function() {
        // Load current player from localStorage
        loadCurrentPlayer();
        // Initialize WebSocket connection
        connectWebSocket();

        // Event Listener für Buttons
        document.getElementById('joinLobbyBtn').addEventListener('click', joinLobby);
        document.getElementById('leaveLobbyBtn').addEventListener('click', leaveLobby);
    };

    // Load current player from localStorage
    function loadCurrentPlayer() {
        const savedPlayer = localStorage.getItem('currentPlayer');
        if (savedPlayer) {
            currentPlayer = JSON.parse(savedPlayer);
            document.getElementById('currentPlayerName').textContent = currentPlayer.username;
            document.getElementById('playerInfo').classList.remove('d-none');
        } else {
            // Redirect to login if no player is set
            alert('Bitte erst registrieren oder anmelden!');
            window.location.href = '/signup.html';
        }
    }

    // WebSocket connection
    function connectWebSocket() {
        const socket = new SockJS('/quiz-websocket');
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function(frame) {
            console.log('✅ WebSocket connected for Lobby');

            // Subscribe to lobby status updates
            stompClient.subscribe('/user/queue/lobby.status', function(message) {
                const lobbyStatus = JSON.parse(message.body);
                updateLobbyStatus(lobbyStatus);
            });

            // Subscribe to game match notifications
            stompClient.subscribe('/user/queue/game.match', function(message) {
                const gameMatch = JSON.parse(message.body);
                handleGameMatch(gameMatch);
            });

            // Subscribe to game start
            stompClient.subscribe('/user/queue/game.start', function(message) {
                const gameStart = JSON.parse(message.body);
                startGame(gameStart);
            });

        }, function(error) {
            console.error('WebSocket error:', error);
            showError('Verbindungsfehler zur Lobby');
        });
    }

    // Join lobby
    function joinLobby() {
        if (!stompClient || !stompClient.connected) {
            showError('Keine WebSocket Verbindung');
            return;
        }

        if (!currentPlayer) {
            showError('Kein Spieler eingeloggt');
            return;
        }

        currentCategory = document.getElementById('categorySelect').value;
        isInLobby = true;

        // Send join request
        stompClient.send("/app/game.join", {}, JSON.stringify({
            playerId: currentPlayer.id,
            category: currentCategory
        }));

        // Update UI
        document.getElementById('joinLobbyBtn').classList.add('d-none');
        document.getElementById('leaveLobbyBtn').classList.remove('d-none');
        document.getElementById('categorySelect').disabled = true;

        showInfo('Lobby betreten... Suche nach Gegner');
    }

    // Leave lobby
    function leaveLobby() {
        if (stompClient && stompClient.connected && currentPlayer) {
            stompClient.send("/app/game.leave", {}, JSON.stringify({
                playerId: currentPlayer.id,
                category: currentCategory
            }));
        }

        resetLobbyUI();
        showInfo('Lobby verlassen');
    }

    // Update lobby status
    function updateLobbyStatus(lobbyStatus) {
        const statusDiv = document.getElementById('lobbyStatus');
        const queueInfo = document.getElementById('queueInfo');
        const queuePosition = document.getElementById('queuePosition');

        statusDiv.className = 'alert ';
        queueInfo.classList.add('d-none');

        switch(lobbyStatus.status) {
            case 'WAITING':
                statusDiv.classList.add('status-waiting');
                statusDiv.innerHTML = '<h5>⏳ In Warteschlange</h5><p>' + lobbyStatus.message + '</p>';

                queueInfo.classList.remove('d-none');
                queuePosition.innerHTML =
                    '<strong>Position:</strong> ' + lobbyStatus.positionInQueue + '<br>' +
                    '<strong>Spieler in Warteschlange:</strong> ' + lobbyStatus.totalPlayersInQueue;
                break;

            case 'MATCHED':
                statusDiv.classList.add('status-matched');
                statusDiv.innerHTML = '<h5>✅ Gegner gefunden!</h5><p>' + lobbyStatus.message + '</p>';
                break;

            case 'GAME_STARTING':
                statusDiv.classList.add('status-starting');
                statusDiv.innerHTML = '<h5>🚀 Spiel startet...</h5><p>' + lobbyStatus.message + '</p>';
                break;

            default:
                statusDiv.classList.add('alert-secondary');
                statusDiv.innerHTML = '<h5>👥 Warte auf Spielstart</h5><p>' + (lobbyStatus.message || 'Wähle eine Kategorie') + '</p>';
        }
    }

    // Handle game match
    function handleGameMatch(gameMatch) {
        document.getElementById('matchInfo').classList.remove('d-none');
        document.getElementById('queueInfo').classList.add('d-none');

        const opponentInfo = document.getElementById('opponentInfo');
        opponentInfo.innerHTML =
            '<img src="' + (gameMatch.opponent.profileImageUrl || '/images/default-avatar.jpg') + '" ' +
            'class="player-avatar mb-2" alt="' + gameMatch.opponent.username + '">' +
            '<div><strong>' + gameMatch.opponent.username + '</strong></div>' +
            '<small class="text-muted">Spiele: ' + gameMatch.opponent.totalGames + ' | Siege: ' + gameMatch.opponent.gamesWon + '</small>';

        // Start countdown
        let countdown = 5;
        const countdownElement = document.getElementById('countdown');

        gameStartCountdown = setInterval(function() {
            countdown--;
            countdownElement.textContent = countdown;

            if (countdown <= 0) {
                clearInterval(gameStartCountdown);
                document.getElementById('matchInfo').innerHTML =
                    '<div class="text-center">' +
                    '<h5>🎮 Spiel startet!</h5>' +
                    '<p>Weiterleitung zum Spiel...</p>' +
                    '</div>';
            }
        }, 1000);
    }

    // Start game
    function startGame(gameStart) {
        // Save game info to localStorage
        localStorage.setItem('currentGame', JSON.stringify(gameStart));

        // Redirect to game page
        setTimeout(function() {
            window.location.href = '/game.html?gameId=' + gameStart.gameId;
        }, 2000);
    }

    // Reset lobby UI
    function resetLobbyUI() {
        isInLobby = false;

        document.getElementById('joinLobbyBtn').classList.remove('d-none');
        document.getElementById('leaveLobbyBtn').classList.add('d-none');
        document.getElementById('categorySelect').disabled = false;
        document.getElementById('queueInfo').classList.add('d-none');
        document.getElementById('matchInfo').classList.add('d-none');

        document.getElementById('lobbyStatus').className = 'alert alert-secondary text-center';
        document.getElementById('lobbyStatus').innerHTML =
            '<h5>👥 Warte auf Spielstart</h5>' +
            '<p class="mb-0">Wähle eine Kategorie und betrete die Lobby</p>';

        if (gameStartCountdown) {
            clearInterval(gameStartCountdown);
        }
    }

    // Helper functions
    function showError(message) {
        alert('❌ ' + message);
    }

    function showInfo(message) {
        console.log('ℹ️ ' + message);
    }

    // Category change
    document.getElementById('categorySelect').addEventListener('change', function() {
        if (isInLobby) {
            showInfo('Kategorie geändert - Lobby wird aktualisiert');
            leaveLobby();
            setTimeout(joinLobby, 500);
        }
    });

    // Prevent page leave while in lobby
    window.addEventListener('beforeunload', function(e) {
        if (isInLobby) {
            e.preventDefault();
            e.returnValue = 'Bist du sicher, dass du die Lobby verlassen möchtest?';
        }
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizDuell</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body>
<div class="container text-center" style="max-width: 400px; margin-top: 100px;">
  <h1 class="mb-4">🎮 QuizDuell</h1>

  <!-- Aktueller Spieler Status -->
  <div id="playerStatus" class="alert alert-info mb-4 d-none">
    <strong>Eingeloggt als:</strong> <span id="currentPlayerDisplay">-</span>
    <button onclick="logout()" class="btn btn-sm btn-outline-danger ms-2">Abmelden</button>
  </div>

  <!-- Navigation Buttons -->
  <div id="authButtons">
    <a href="/signup.html" class="btn btn-primary btn-lg d-block w-100 mb-3">Registrieren</a>
    <a href="/login.html" class="btn btn-success btn-lg d-block w-100 mb-3">Anmelden</a>
  </div>

  <div id="gameButtons" class="d-none">
    <a href="/lobby.html" class="btn btn-warning btn-lg d-block w-100 mb-3"> Zur Lobby</a>
    <a href="/test-websocket.html" class="btn btn-info btn-lg d-block w-100 mb-3">WebSocket Test</a>
  </div>
</div>

<script>
  // Beim Laden prüfen ob Spieler eingeloggt ist
  window.onload = function() {
      checkLoginStatus();
  };

  // Login-Status prüfen
  function checkLoginStatus() {
      const player = localStorage.getItem('currentPlayer');
      const playerStatus = document.getElementById('playerStatus');
      const authButtons = document.getElementById('authButtons');
      const gameButtons = document.getElementById('gameButtons');

      if (player) {
          const playerData = JSON.parse(player);

          // Status anzeigen
          document.getElementById('currentPlayerDisplay').textContent = playerData.username;
          playerStatus.classList.remove('d-none');

          // Buttons anpassen
          authButtons.classList.add('d-none');
          gameButtons.classList.remove('d-none');
      } else {
          // Nicht eingeloggt
          playerStatus.classList.add('d-none');
          authButtons.classList.remove('d-none');
          gameButtons.classList.add('d-none');
      }
  }

  // Abmelden
  function logout() {
      localStorage.removeItem('currentPlayer');
      localStorage.removeItem('currentGame');
      checkLoginStatus(); // UI aktualisieren
      alert('Abgemeldet!');
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />

  <!--
    ============================================================
    File: index.html
    Purpose:
      - Start-/Landing-Page für QuizDuell
      - Zeigt je nach Login-Status:
        (a) Registrieren/Anmelden oder
        (b) Lobby-Button + eingeloggter Nutzer + Logout
    Dependencies:
      - Bootstrap 5 (Layout/Buttons/Alerts)
    Storage:
      - localStorage.currentPlayer (JSON) -> Login-Status & Username
      - localStorage.currentGame   (JSON) -> aktuelles Spiel (wird bei Logout gelöscht)
    ============================================================
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>QuizDuell</title>

  <!-- Bootstrap Styles -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Bootstrap JS Bundle (für evtl. Komponenten; hier optional, aber ok) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>

<body>
<!--
  ============================================================
  SECTION: MAIN CONTAINER
  - Zentriertes Layout (max-width: 400px)
  - 3 logische Bereiche:
    1) playerStatus  -> sichtbar, wenn eingeloggt
    2) authButtons   -> sichtbar, wenn ausgeloggt
    3) gameButtons   -> sichtbar, wenn eingeloggt
  ============================================================
-->
<div class="container text-center" style="max-width: 400px; margin-top: 100px;">
  <h1 class="mb-4">QuizDuell</h1>

  <!--
    ============================================================
    BLOCK: PLAYER STATUS (Login-Info + Logout)
    - Default: d-none (versteckt)
    - Wird eingeblendet, wenn localStorage.currentPlayer existiert
    ============================================================
  -->
  <div id="playerStatus" class="alert alert-info mb-4 d-none">
    <strong>Eingeloggt als:</strong> <span id="currentPlayerDisplay">-</span>

    <!-- Logout ruft JS-Funktion logout() auf -->
    <button type="button" class="btn btn-sm btn-outline-danger ms-2" onclick="logout()">
      Abmelden
    </button>
  </div>

  <!--
    ============================================================
    BLOCK: AUTH BUTTONS (Registrieren/Anmelden)
    - Wird angezeigt, wenn KEIN currentPlayer vorhanden ist
    ============================================================
  -->
  <div id="authButtons">
    <a href="/signup.html" class="btn btn-primary btn-lg d-block w-100 mb-3">Registrieren</a>
    <a href="/login.html"  class="btn btn-success btn-lg d-block w-100 mb-3">Anmelden</a>
  </div>

  <!--
    ============================================================
    BLOCK: GAME BUTTONS (Lobby)
    - Default: d-none (versteckt)
    - Wird angezeigt, wenn currentPlayer vorhanden ist
    ============================================================
  -->
  <div id="gameButtons" class="d-none">
    <a href="/lobby.html" class="btn btn-warning btn-lg d-block w-100 mb-3">Zur Lobby</a>
  </div>
</div>

<script>
  /* =====================================================================
     JSDOC TYPE DEFINITIONS
     ---------------------------------------------------------------------
     Minimaler Typ für currentPlayer aus localStorage.
     (Du nutzt aktuell nur username, id könnte aber auch existieren.)
     ===================================================================== */

  /**
   * @typedef {Object} CurrentPlayer
   * @property {number} [id]        - Spieler-ID (falls gespeichert)
   * @property {string} username    - Anzeigename
   * @property {string} [profileImageUrl]
   */

  /* =====================================================================
     DOM HELPERS
     ===================================================================== */

  /**
   * Shortcut: Element per ID holen.
   * @param {string} id
   * @returns {HTMLElement|null}
   */
  const $ = (id) => document.getElementById(id);

  /**
   * Zeigt oder versteckt ein Element über Bootstrap-Klasse "d-none".
   * @param {HTMLElement} el - Ziel-Element
   * @param {boolean} show - true = anzeigen, false = verstecken
   * @returns {void}
   */
  const toggle = (el, show) => el.classList.toggle('d-none', !show);

  /* =====================================================================
     INIT
     - Beim Laden der Seite prüfen wir den Login-Status.
     ===================================================================== */

  window.onload = checkLoginStatus;

  /* =====================================================================
     LOGIN STATUS LOGIC
     ===================================================================== */

  /**
   * Prüft, ob ein Spieler in localStorage gespeichert ist.
   *
   * Ergebnis:
   * - Wenn NICHT eingeloggt:
   *   - playerStatus verstecken
   *   - authButtons anzeigen
   *   - gameButtons verstecken
   *
   * - Wenn eingeloggt:
   *   - playerStatus anzeigen (inkl. Username)
   *   - authButtons verstecken
   *   - gameButtons anzeigen (Lobby-Link)
   *
   * @returns {void}
   */
  function checkLoginStatus() {
    const raw = localStorage.getItem('currentPlayer');

    const playerStatus = $('playerStatus');
    const authButtons = $('authButtons');
    const gameButtons = $('gameButtons');

    // Kein Spieler gespeichert -> ausgeloggt
    if (!raw) {
      toggle(playerStatus, false);
      toggle(authButtons, true);
      toggle(gameButtons, false);
      return;
    }

    /** @type {CurrentPlayer} */
    const player = JSON.parse(raw);

    // Username anzeigen
    $('currentPlayerDisplay').textContent = player.username;

    // UI-State auf "eingeloggt" setzen
    toggle(playerStatus, true);
    toggle(authButtons, false);
    toggle(gameButtons, true);
  }

  /* =====================================================================
     LOGOUT
     ===================================================================== */

  /**
   * Loggt den Nutzer lokal aus:
   * - Entfernt currentPlayer und currentGame aus localStorage
   * - Aktualisiert die UI mit checkLoginStatus()
   * - Gibt dem Nutzer Feedback via alert()
   *
   * Hinweis:
   * - Das ist ein Client-Logout (kein Server-Invalidate nötig),
   *   da ihr Login via localStorage verwaltet.
   *
   * @returns {void}
   */
  function logout() {
    localStorage.removeItem('currentPlayer');
    localStorage.removeItem('currentGame');

    checkLoginStatus();
    alert('Abgemeldet!');
  }
</script>
</body>
</html>

# Application Name
spring.application.name=Patterns_und_Framework_Gruppe_K

# H2 Database (embedded - läuft im Speicher)
spring.datasource.url=jdbc:h2:mem:quizdueldb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File Upload Konfiguration
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
spring.servlet.multipart.enabled=true

# H2 Console (Web Interface)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Flyway temporär deaktivieren (für den Start)
spring.flyway.enabled=false

# Security temporär deaktivieren
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# DevTools
spring.devtools.restart.enabled=true